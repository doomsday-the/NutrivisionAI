services:
  - type: web
    name: nutrivision-backend
    env: node
    region: singapore
    plan: free
    buildCommand: cd backend-api && npm ci --include=dev && npx prisma generate && npm run build
    startCommand: cd backend-api && node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        value: 558532335340-jsbgfpii5qojdbdk8oa23tlukjhljrca.apps.googleusercontent.com
      - key: GEMINI_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: DEV_LOGIN_ENABLED
        value: true

