name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: nutrivision_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U user -d nutrivision_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend-api/package-lock.json

    - name: Install dependencies
      working-directory: ./backend-api
      run: npm ci

    - name: Setup Database
      working-directory: ./backend-api
      run: npm run test:db

    - name: Build
      working-directory: ./backend-api
      run: npm run build

    - name: Run Tests
      working-directory: ./backend-api
      run: npm run test
