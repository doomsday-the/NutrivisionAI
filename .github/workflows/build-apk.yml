name: Build Android Companion APK

on:
  push:
    branches: [ main, aryaman-webhook-update ]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build NutriVision Sync APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: ./mobile-app
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp mobile-app/app/build/outputs/apk/debug/app-debug.apk release-output/NutriVisionSync.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NutriVisionSync-APK
          path: release-output/NutriVisionSync.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/aryaman-webhook-update'
        with:
          tag_name: companion-latest
          name: NutriVision Android Companion App
          body: |
            ### 📱 NutriVision Sync (Android Companion)
            Lightweight on-demand Android companion app to bridge **Samsung Health** steps and active calories to your NutriVision AI dashboard with 1 tap.
            
            #### How to Install:
            1. Download `NutriVisionSync.apk` below directly onto your Android device.
            2. Tap the downloaded file to install.
            3. Open the app, grant Health Connect read access, and tap **"PUSH TO NUTRIVISION WEB"**!
          files: release-output/NutriVisionSync.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
