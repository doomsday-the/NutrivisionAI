version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nutrivision-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nutrivision
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d nutrivision"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-api:
    build: ./backend-api
    container_name: nutrivision-backend
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/nutrivision?schema=public
      - JWT_SECRET=dev_secret_key
      - AI_SERVICE_URL=http://ai-service:8000
      - X_INTERNAL_TOKEN=shared_secret_between_node_and_python
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend-api:/app
      - /app/node_modules

  ai-service:
    build: ./ai-service
    container_name: nutrivision-ai
    ports:
      - "8000:8000"
    environment:
      - X_INTERNAL_TOKEN=shared_secret_between_node_and_python
    volumes:
      - ./ai-service:/app

volumes:
  postgres_data:
